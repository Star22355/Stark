<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MILKBOX — Black Brink UI with Chatcord</title>
  <link rel="icon" href="https://raw.githubusercontent.com/IordBeerus/MILKBOX/main/SiteIcon.png">

  <style>
    /* --------- Base & variables --------- */
    :root{
      --bg:#070708;
      --panel:#0c0d0f;
      --muted:#9aa0a6;
      --text:#f6f7f9;
      --accent-pink:#ff99c3;
      --accent-purple:#6f5ef8;
      --glass: rgba(255,255,255,0.03);
    }
    html,body{height:100%; margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;}
    body{background:linear-gradient(180deg,#050506 0%,#0b0c0e 100%); color:var(--text); -webkit-font-smoothing:antialiased;}

    /* --------- App layout --------- */
    .app{display:flex; min-height:100vh; }
    /* left rail */
    .rail{width:64px; padding:18px 8px; display:flex; flex-direction:column; gap:10px; align-items:center; box-sizing:border-box;}
    .rail .icon-btn{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted); background:transparent;border:1px solid transparent; cursor:pointer;}
    .rail .icon-btn:hover{background:rgba(255,255,255,0.02)}
    .rail .icon-btn.active{background:linear-gradient(180deg, rgba(111,94,248,0.12), rgba(255,153,195,0.06)); box-shadow:0 6px 18px rgba(0,0,0,0.7); color:var(--accent-purple); border:1px solid rgba(255,255,255,0.03)}

    /* main area */
    .main{flex:1; display:flex; flex-direction:column; min-height:100vh;}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px; gap:16px;}
    .brand{display:flex;align-items:center;gap:12px}
    .brand img{width:36px;height:36px;border-radius:8px;}
    .brand .title{font-weight:900;letter-spacing:0.6px}
    .nav{display:flex;gap:12px;align-items:center;color:var(--muted)}

    /* search */
    .search{display:flex;align-items:center;gap:10px}
    .search input{background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.03); color:var(--muted); padding:10px 14px; border-radius:12px; min-width:360px}
    .search input::placeholder{color:rgba(255,255,255,0.25)}

    /* Chatcord button style */
    .chat-btn{display:inline-flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:linear-gradient(180deg,var(--accent-purple),#4b3be5);color:#fff;font-weight:700;border:1px solid rgba(255,255,255,0.06);cursor:pointer}
    .chat-btn svg{opacity:0.95}

    /* hero */
    .hero{position:relative; margin:14px 22px; border-radius:14px; overflow:hidden; min-height:420px; box-shadow:0 20px 60px rgba(0,0,0,0.7);}
    .hero .bg{position:absolute;inset:0;background-image:url('https://images.unsplash.com/photo-1497032628192-86f99bcd76bc?auto=format&fit=crop&w=1800&q=80'); background-size:cover;background-position:center; filter:saturate(1.1) contrast(0.9);} 
    .hero::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg, rgba(3,3,3,0.8) 0%, rgba(3,3,3,0.42) 35%, rgba(3,3,3,0.75) 100%);} 
    .hero-inner{position:relative;z-index:2;display:flex;align-items:flex-end;height:100%;padding:44px 56px;} 
    .hero-left{max-width:540px}
    .kicker{display:inline-flex;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,0.03);color:var(--accent-pink);font-weight:800;font-size:12px;margin-bottom:12px}
    .hero h1{font-size:68px;line-height:0.95;margin:0;color:var(--accent-pink);font-weight:900}
    .hero p{color:var(--muted);margin-top:12px;max-width:460px}
    .hero-actions{margin-top:18px;display:flex;gap:12px}
    .btn-play{background:#fff;color:#000;padding:12px 18px;border-radius:12px;border:none;font-weight:800;cursor:pointer}
    .btn-info{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--text);padding:12px 18px;border-radius:12px;cursor:pointer}

    /* section rows */
    .section{margin:26px 22px}
    .section h3{margin:0 0 12px 0;color:var(--text)}
    .row{display:flex;gap:18px;overflow-x:auto;padding-bottom:8px}
    .row::-webkit-scrollbar{height:8px}
    .row::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.03);border-radius:8px}

    .card{min-width:200px;width:200px;background:linear-gradient(180deg,rgba(255,255,255,0.01),transparent);border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.02);box-shadow:0 20px 60px rgba(0,0,0,0.7)}
    .thumb{height:300px;overflow:hidden;background:#000}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .meta{padding:12px}
    .genre{font-size:12px;color:var(--accent-pink);font-weight:800}
    .title{font-weight:800;color:var(--text);margin-top:8px}
    .sub{font-size:12px;color:var(--muted);margin-top:6px}

    /* info modal / chat modal */
    .modal{display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;background:rgba(0,0,0,0.6)}
    .modal .content{width:100%;max-width:1100px;height:80vh;background:#151517;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.04)}
    .modal .close{position:absolute;right:12px;top:8px;z-index:3;background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer}
    .modal iframe{width:100%;height:100%;border:0}

    /* small responsive */
    @media (max-width:900px){
      .search input{min-width:120px}
      .hero h1{font-size:42px}
      .rail{display:none}
    }
  </style>
</head>
<body>

  <div class="app">
    <!-- Left rail -->
    <aside class="rail" aria-hidden="false">
      <button class="icon-btn active" title="Home" aria-label="Home">▶</button>
      <button class="icon-btn" title="Profile" aria-label="Profile">👤</button>
      <button class="icon-btn" title="New Tab" aria-label="New Tab">✚</button>
      <button class="icon-btn" title="History" aria-label="History">⟲</button>
      <button class="icon-btn" title="Downloads" aria-label="Downloads">⬇</button>
      <div style="flex:1"></div>
      <button class="icon-btn" title="Music" aria-label="Music">🎵</button>
      <button class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar" role="banner">
        <div class="brand">
          <img src="https://raw.githubusercontent.com/IordBeerus/MILKBOX/main/SiteIcon.png" alt="logo">
          <div class="title">MILKBOX</div>
          <nav class="nav" aria-label="Main navigation">
            <div class="pill" style="padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.02);">Browse</div>
            <div style="opacity:.9;color:var(--muted)">Movies</div>
            <div style="opacity:.9;color:var(--muted)">TV Shows</div>
            <div style="opacity:.9;color:var(--muted)">Trending</div>
          </nav>
        </div>

        <div style="display:flex;align-items:center;gap:12px">
          <div class="search">
            <input type="search" placeholder="Search titles..." aria-label="Search titles">
          </div>
          <button id="openChat" class="chat-btn" title="Open Chatcord">
            <!-- small discord-like icon -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z" fill="white" opacity="0.06"/></svg>
            <span style="font-weight:800">CHATCORD</span>
          </button>
        </div>
      </header>

      <!-- Hero -->
      <section class="hero" role="region" aria-label="Featured">
        <div class="bg" aria-hidden="true"></div>
        <div class="hero-inner">
          <div class="hero-left">
            <div class="kicker">FEATURED &nbsp;•&nbsp; MILKBOX ORIGINAL</div>
            <h1>Hollow<br>Crown</h1>
            <p>A disgraced queen reclaims her fractured empire through shadow diplomacy and calculated violence. 8 episodes. Award-winning drama.</p>
            <div class="hero-actions">
              <button class="btn-play" aria-label="Play">► Play</button>
              <button class="btn-info" aria-label="More info">More Info</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Movies row -->
      <section class="section" aria-label="Movies">
        <h3>Movies</h3>
        <div class="row" id="moviesRow" tabindex="0"></div>
      </section>

      <!-- Trending row -->
      <section class="section" aria-label="Trending">
        <h3>Trending Now</h3>
        <div class="row" id="trendingRow"></div>
      </section>
    </main>
  </div>

  <!-- Chatcord modal -->
  <div id="chatModal" class="modal" aria-hidden="true">
    <div class="content" role="dialog" aria-modal="true" aria-label="Chatcord">
      <button class="close" id="closeChat" title="Close">✕</button>
      <iframe id="chatIframe" src="" title="Chatcord" sandbox="allow-scripts allow-forms allow-same-origin allow-popups"></iframe>
    </div>
  </div>

  <script>
    /* ---------- Populate sample cards (use your real data instead) ---------- */
    const movies = [
      {title:'Neon Requiem', genre:'SCI-FI', year:2024, rating:8.2, img:'https://picsum.photos/seed/a/420/640'},
      {title:'The Last Signal', genre:'THRILLER', year:2024, rating:7.9, img:'https://picsum.photos/seed/b/420/640'},
      {title:'Hollow Crown', genre:'DRAMA', year:2023, rating:8.7, img:'https://picsum.photos/seed/c/420/640'},
      {title:'Crimson Dusk', genre:'ACTION', year:2024, rating:7.5, img:'https://picsum.photos/seed/d/420/640'},
      {title:'Echoes of War', genre:'WAR', year:2023, rating:8.0, img:'https://picsum.photos/seed/e/420/640'},
      {title:'The Watcher', genre:'HORROR', year:2024, rating:7.3, img:'https://picsum.photos/seed/f/420/640'},
      {title:'Astral Void', genre:'SCI-FI', year:2024, rating:8.4, img:'https://picsum.photos/seed/g/420/640'}
    ];

    function cardHTML(m){
      return `
        <div class="card" role="article">
          <div class="thumb"><img src="${m.img}" alt="${m.title} poster"></div>
          <div class="meta">
            <div class="genre">${m.genre}</div>
            <div class="title">${m.title}</div>
            <div class="sub">${m.year} • ⭐ ${m.rating}</div>
          </div>
        </div>`;
    }

    const moviesRow = document.getElementById('moviesRow');
    const trendingRow = document.getElementById('trendingRow');
    movies.forEach(m => moviesRow.insertAdjacentHTML('beforeend', cardHTML(m)));
    movies.slice().reverse().forEach(m => trendingRow.insertAdjacentHTML('beforeend', cardHTML(m)));

    /* ---------- Chatcord embed + fallback ---------- */
    const CHAT_URL = 'https://cdn.staticdelivr.com/gh/2pro12342/Chatcord/refs/heads/main/chatcord.html'; // user-provided
    const openChat = document.getElementById('openChat');
    const chatModal = document.getElementById('chatModal');
    const chatIframe = document.getElementById('chatIframe');
    const closeChat = document.getElementById('closeChat');

    openChat.addEventListener('click', (e)=>{
      e.preventDefault();
      // lazy-load iframe to reduce initial load
      chatIframe.src = CHAT_URL;
      chatModal.style.display = 'flex';
      chatModal.setAttribute('aria-hidden','false');
      document.body.style.overflow = 'hidden';

      // best-effort fallback: if iframe doesn't load (some servers block X-Frame-Options),
      // prompt user to open in new tab after a short timeout
      let loaded = false;
      function onLoad(){ loaded = true; chatIframe.removeEventListener('load', onLoad); }
      chatIframe.addEventListener('load', onLoad);

      setTimeout(() => {
        if (!loaded) {
          // Ask user for fallback and open in new tab if they accept
          const openDirect = confirm('Embedding the Chatcord page was blocked. Open Chatcord in a new tab instead?');
          if (openDirect) {
            window.open(CHAT_URL, '_blank', 'noopener');
          }
          // close modal and cleanup
          chatIframe.src = '';
          chatModal.style.display = 'none';
          chatModal.setAttribute('aria-hidden','true');
          document.body.style.overflow = '';
        }
      }, 1400);
    });

    closeChat.addEventListener('click', ()=>{ chatIframe.src = ''; chatModal.style.display = 'none'; chatModal.setAttribute('aria-hidden','true'); document.body.style.overflow = ''; });
    chatModal.addEventListener('click', (ev)=>{ if (ev.target === chatModal) closeChat.click(); });

    /* ---------- Optional: keyboard close (Esc) ---------- */
    document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') { if (chatModal.style.display === 'flex') closeChat.click(); } });
  </script>
</body>
</html>
